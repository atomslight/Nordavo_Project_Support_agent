[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nordavo"
version = "0.1.0"
description = "Nordavo helpdesk ticket language analysis"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.0.0",
  "groq>=0.30.0",
  "pydantic>=2.0.0",
]

[project.scripts]
nordavo = "nordavo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
